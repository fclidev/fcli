name: docs

# Build the documentation site in docs/ and publish it to GitHub Pages.
#
# THREE things about Pages are load-bearing here. All three were learned the hard
# way, by shipping a broken fcli.dev; do not "simplify" any of them out.
#
# 1. configure-pages is what puts Pages into Actions mode.
#    Pages can be in one of two modes: build-from-a-branch (Jekyll) or
#    publish-an-Artifact (Actions). If it is in branch mode, GitHub's own
#    `pages build and deployment` workflow fires on every push to the source
#    branch and its output WINS, overwriting whatever deploy-pages just
#    published. That is a two-publisher race and it is exactly what broke the
#    first cutover: fcli.dev rendered docs/README.md through Jekyll while this
#    workflow reported success and published nothing visible.
#    actions/configure-pages is the step that switches the mode and removes the
#    competing workflow. Skipping it makes deploy-pages a no-op.
#
# 2. docs/ must never be a Pages publishing source.
#    `/docs` on the default branch is GitHub's built-in "my site lives here"
#    choice, so a stale branch-mode setting silently finds it. docs/ holds
#    build.js, check.js, package.json and raw Markdown -- so when that happened,
#    fcli.dev publicly served /build.js and /package.json next to a Jekyllised
#    README. The site source and the publishing source have to be different
#    places; the artifact is what gets published.
#
# 3. dist/.nojekyll stays even though Actions mode does not run Jekyll.
#    Free insurance: if Pages ever falls back to branch mode, the marker is
#    already in the output. check.js fails the build if it goes missing.
#
# SITE_ORIGIN is baked into canonical tags, sitemap.xml and llms.txt at build
# time. SITE_BASE stays unset: the site is served from the root of fcli.dev, so
# build.js emits root-absolute URLs and neither build.js nor check.js needs
# base-path awareness (check.js has none; SITE_BASE=/fcli reports 11 false
# failures).

on:
  # Build on any push to main, deploy only from main (see the deploy job's if).
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  # Editing the custom domain in the repo UI pushes nothing, so the only way to
  # republish after a domain or DNS change is to run this by hand. Deliberately
  # no paths filter on the whole on: block: a paths filter applies to every
  # event listed with it, so a manual run on a commit that touched no docs would
  # have been filtered out and never executed.
  workflow_dispatch:

# Only one deployment at a time; a docs PR pushed three times needs only the last
# build. The deploy job is serialized by the environment, not just by this.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# pages: write publishes; id-token: write mints the OIDC attestation GitHub
# requires to accept the deployment. No PAGES_TOKEN secret is stored.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the core's engines floor so one Node serves both workspaces.
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: install
        working-directory: docs
        run: npm ci --no-audit --no-fund

      - name: build and check
        working-directory: docs
        env:
          SITE_ORIGIN: https://fcli.dev
        run: |
          npm run build
          node check.js

      - name: upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    # The github-pages environment has a branch policy permitting main only; a
    # deploy from any other ref dies with "Branch X is not allowed to deploy to
    # github-pages due to environment protection rules". Guard the job, not the
    # trigger, so feature branches simply skip instead of erroring.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://fcli.dev
    steps:
      # Switches Pages to Actions publishing mode and deletes the legacy
      # `pages build and deployment` workflow. Without this the Jekyll build
      # keeps winning the race and this job publishes nothing visible. Must run
      # before deploy-pages, in the deploy job, with the pages permission.
      - name: configure Pages
        uses: actions/configure-pages@v5

      - name: publish
        uses: actions/deploy-pages@v4
